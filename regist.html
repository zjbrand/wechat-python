<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー新規登録</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: #1f2937;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: linear-gradient(135deg, #e8f5ee 0%, #f7fbff 52%, #eef4ff 100%);
    }

    .register-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 32px;
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      color: #111827;
      font-size: 28px;
      line-height: 1.25;
      text-align: center;
    }

    .lead {
      margin: 0 0 28px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 13px 14px;
      color: #111827;
      font-size: 16px;
      line-height: 1.4;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #18a058;
      box-shadow: 0 0 0 4px rgba(24, 160, 88, 0.14);
    }

    .submit-button {
      margin-top: 8px;
      border: 0;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #18a058 0%, #0f8f9f 100%);
      box-shadow: 0 10px 22px rgba(24, 160, 88, 0.22);
    }

    .submit-button:hover {
      filter: brightness(1.04);
    }

    .login-link {
      margin: 20px 0 0;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }

    .login-link a {
      color: #12805c;
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .register-card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="register-card">
    <h1>ユーザー新規登録</h1>
    <p class="lead">メールアドレスとパスワードを入力してください。</p>

    <form action="/register" method="post">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" name="email" id="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" name="password" id="password" placeholder="パスワード" required>
      </div>

      <div class="form-group">
        <label for="password_confirm">パスワード確認</label>
        <input type="password" name="password_confirm" id="password_confirm" placeholder="もう一度入力" required>
      </div>

      <input class="submit-button" type="submit" value="登録">
    </form>

    <p class="login-link">すでにアカウントをお持ちですか？ <a href="login.html">ログイン</a></p>
  </main>
</body>

</html>
