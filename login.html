<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーログイン</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      padding: 16px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      padding: 40px 32px;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 600;
      color: #2d2d3a;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-bottom: 28px;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a4a58;
      margin-bottom: 6px;
    }

    .field-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #dcdce6;
      border-radius: 10px;
      background: #f8f8fb;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .field-group input::placeholder {
      color: #b3b3c0;
    }

    .field-group input:focus {
      border-color: #6e8efb;
      box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.15);
      background: #ffffff;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 0;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .divider {
      border: none;
      border-top: 1px solid #ececf2;
      margin: 0 0 24px;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h1>ユーザーログイン</h1>
    <p class="subtitle">アカウント情報を入力してください</p>
    <hr class="divider">
    <form action="/login" method="post">
      <div class="field-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      </div>
      <div class="field-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <input type="submit" class="submit-btn" value="ログイン">
    </form>
    <br>
    <a href="regist.html" style="text-decoration: none;font-size: 12px;">まだ登録しない？こちら登録しましょう。</a>
  </div>

</body>

</html>
